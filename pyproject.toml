[project]
name = "cycle-control"
version = "0.1.0"
description = "A desktop dashboard for your Linear cycle that runs Claude Code builders in parallel."
requires-python = ">=3.12"
dependencies = [
    "pywebview>=5.0",
    "ptyprocess",
    "aiohttp>=3.9",
    "httpx",
    "pydantic-settings",
]

[dependency-groups]
dev = ["ruff", "pytest"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cyclecontrol"]
